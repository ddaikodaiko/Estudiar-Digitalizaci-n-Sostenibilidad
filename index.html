<head>

<style>
:root{--bg:#f3f1ec;--card:#fffdf9;--ink:#1d2330;--mute:#6a7080;--line:#dcd8cf;--acc:#2b4fd8;--acc-ink:#fff;--ok:#1f7a45;--ok-bg:#dff1e6;--bad:#b23a2a;--bad-bg:#f8e1dc;--warn:#a86a00}
@media (prefers-color-scheme:dark){:root{--bg:#12141a;--card:#1b1e26;--ink:#e9eaee;--mute:#9298a6;--line:#2e323d;--acc:#7d97ff;--acc-ink:#0f1220;--ok:#6fd29a;--ok-bg:#183326;--bad:#f08b7b;--bad-bg:#3a1f1b;--warn:#f0b54a}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(70px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px;flex-wrap:wrap}
h1{font-family:Fraunces,serif;font-weight:600;font-size:30px;margin:0;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 12px;font-weight:600}
.sub{color:var(--mute);margin:2px 0 0;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.4;cursor:default}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);margin-bottom:10px}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.q{font-size:19px;font-weight:600;margin:0 0 18px;line-height:1.4}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:9px;font:inherit;color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt b{flex:0 0 26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--bg);font-size:13px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}.opt.ok b{background:var(--ok);color:var(--card)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}.opt.bad b{background:var(--bad);color:var(--card)}
.opt:disabled{cursor:default}
.fb{min-height:24px;font-weight:600;margin:6px 0 14px}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr}}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{display:block;color:var(--mute);font-size:12px}
.stat strong{font-family:Fraunces,serif;font-size:28px;font-weight:600;line-height:1.2}
.stat em{display:block;font-style:normal;font-size:12px;color:var(--mute)}
.units{display:grid;gap:4px;font-size:14px;margin-top:14px}
.units div{display:grid;grid-template-columns:1fr 120px 60px;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.mini{height:6px;background:var(--line);border-radius:6px;overflow:hidden}.mini i{display:block;height:100%;background:var(--acc)}
.rev .it{border-top:1px solid var(--line);padding:12px 0;font-size:14px}
.rev .it p{margin:0 0 4px;font-weight:600}
.rev .y{color:var(--bad)}.rev .c{color:var(--ok)}
.hint{font-size:12px;color:var(--mute);margin-top:12px;text-align:center}
details{font-size:14px;color:var(--mute)}
details summary{cursor:pointer;color:var(--ink);font-weight:500}
details p{margin:8px 0}
svg.chart{width:100%;height:auto;display:block}
.chart-axis{stroke:var(--line)}
.chart-line{fill:none;stroke:var(--acc);stroke-width:2}
.chart-dot{fill:var(--acc)}
.chart-goal{stroke:var(--ok);stroke-dasharray:4 4}
.chart-label{fill:var(--mute);font-size:10px;font-family:Inter,sans-serif}
.foot{margin-top:24px;font-size:12px;color:var(--mute);text-align:center}
@media (hover:none){.hint{display:none}.opt:hover:not(:disabled){border-color:var(--line)}}
@media (max-width:600px){
  .wrap{padding-top:calc(16px + env(safe-area-inset-top))}
  header{margin-bottom:14px}
  h1{font-size:24px}
  .card{padding:16px;border-radius:12px}
  .stats{grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{padding:10px}
  .stat strong{font-size:22px}
  .stat small,.stat em{font-size:11px}
  .units div{grid-template-columns:1fr 44px;row-gap:4px}
  .units div .mini{grid-column:1 / -1;grid-row:2}
  .units div span:last-child{grid-row:1;grid-column:2}
  .seg{width:100%}.seg button{flex:1;padding:10px 6px}
  #modes{display:flex}
  .row .chip{padding:9px 14px}
  .q{font-size:18px}
  .opt{padding:14px;min-height:52px}
  body.quiz header,body.quiz .foot{display:none}
  body.quiz .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  body.quiz .nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);
    padding:10px calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));gap:8px}
  body.quiz .nav .btn{flex:1;padding:14px 8px}
  body.quiz .nav #next{flex:2}
  .btn{min-height:46px}
}
</style>
</head>

// ---------- modelo de proyección ----------
// p(acierto) de cada pregunta: media ponderada de sus intentos (el último pesa el doble que el anterior),
// con un "intento virtual" que vale tu tasa de acierto a la primera. Sin intentos: esa misma tasa.
function firstTryRate(st){
  let n=0,c=0;for(const id in st.att){const a=st.att[id];if(a.length){n++;c+=a[0].ok?1:0}}
  return n?(c+0.25)/(n+1):0.25;
}
function pCorrect(a,prior){
  if(!a||!a.length) return prior;
  let w=1,sw=0.25,sx=0.25*prior;
  for(let i=a.length-1;i>=0;i--){sw+=w;sx+=w*(a[i].ok?1:0);w/=2}
  return sx/sw;
}
function bankError(st,qs){
  const prior=firstTryRate(st);
  return 1-qs.reduce((s,q)=>s+pCorrect(st.att[q.id],prior),0)/qs.length;
}
function secPerQ(st){
  let n=0,t=0;for(const id in st.att)for(const x of st.att[id]){n++;t+=x.s}
  return n>=10?t/n:DEFAULT_SEC;
}
// Ajuste exponencial error(t)=e0·exp(-k·t) sobre las fotos tomadas al acabar cada test (t = tiempo acumulado).
function fitK(st,qs){
  const pts=st.sessions.filter(s=>s.err>0.001).map(s=>[s.tCum/3600,Math.log(s.err)]);
  if(pts.length<2) return null;
  const n=pts.length,mx=pts.reduce((a,p)=>a+p[0],0)/n,my=pts.reduce((a,p)=>a+p[1],0)/n;
  let num=0,den=0;for(const [x,y] of pts){num+=(x-mx)*(y-my);den+=(x-mx)**2}
  if(den<=0) return null;
  return -num/den; // por hora
}
function projection(st,qs){
  const N=qs.length, err=bankError(st,qs), spq=secPerQ(st);
  const nota=10*(1-err);
  const n=Math.min(EXAM_N,N);
  const eTarget=1-Math.pow(P10_GOAL,1/n);              // error con el que P(30/30) = 50 %
  const e95=0.05;                                       // nota media 9,5 en el examen
  const kFit=fitK(st,qs);
  const kDefault=Math.LN2/(N*spq/3600);                 // supuesto: cada vuelta completa reduce a la mitad los fallos
  const k = kFit && kFit>0 ? kFit : (kFit===null ? kDefault : 0);
  const need=e=>err<=e ? 0 : (k>0 ? Math.log(err/e)/k : Infinity);
  let hours = need(eTarget), hours95 = need(e95);
  const passes = isFinite(hours) ? hours*3600/(N*spq) : Infinity;
  const tCum = st.sessions.length ? st.sessions[st.sessions.length-1].tCum : 0;
    const ex=examSim(st,qs);
  return {N,err,nota,spq,k,kFit,hours,hours95,passes,tCum,eTarget,usingDefault:!kFit,ex};
}
// Simulación del examen: 30 preguntas al azar del banco (los 3 temas mezclados), cada una acertada con su p.
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function examSim(st,qs,sims=4000){
  const prior=firstTryRate(st), ps=qs.map(q=>pCorrect(st.att[q.id],prior)), N=ps.length, n=Math.min(EXAM_N,N);
  const r=rng(12345), idx=ps.map((_,i)=>i), hist=new Array(n+1).fill(0);
  for(let s=0;s<sims;s++){
    let ok=0;
    for(let i=0;i<n;i++){const j=i+Math.floor(r()*(N-i));[idx[i],idx[j]]=[idx[j],idx[i]];if(r()<ps[idx[i]])ok++}
    hist[ok]++;
  }
  const q=f=>{let c=0;for(let k=0;k<=n;k++){c+=hist[k];if(c>=f*sims)return 10*k/n}return 10};
  return {n,mean:10*ps.reduce((a,b)=>a+b,0)/N,lo:q(0.1),hi:q(0.9),p10:hist[n]/sims,p95:hist.slice(Math.ceil(0.95*n)).reduce((a,b)=>a+b,0)/sims};
}
function fmtPct(p){return p>=0.995?'>99 %':(p<0.005?'<1 %':Math.round(p*100)+' %')}
function fmtH(h){
  if(!isFinite(h)) return '—';
  if(h<=0) return '0 h';
  const m=Math.round(h*60);
  return m<60?m+' min':(Math.floor(m/60)+' h '+String(m%60).padStart(2,'0'));
}

  const s=st.sessions; if(s.length<1) return '';
  const W=Math.min(600,Math.max(300,app.clientWidth-40)),H=W<400?170:150,P=24, xs=s.map(x=>x.tCum/3600), maxX=Math.max(xs[xs.length-1],0.01);
  const X=v=>P+(W-2*P)*v/maxX, Y=v=>H-P-(H-2*P)*v/10;
  const pts=s.map((x,i)=>[X(xs[i]),Y(10*(1-x.err))]);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <line class="chart-axis" x1="${P}" y1="${Y(0)}" x2="${W-P}" y2="${Y(0)}"/>
    <line class="chart-goal" x1="${P}" y1="${Y(TARGET)}" x2="${W-P}" y2="${Y(TARGET)}"/>
    <text class="chart-label" x="${W-P}" y="${Y(TARGET)-4}" text-anchor="end">objetivo ${TARGET}</text>
    <text class="chart-label" x="${P}" y="${H-6}">0 h</text>
    <text class="chart-label" x="${W-P}" y="${H-6}" text-anchor="end">${fmtH(maxX)} estudiadas</text>
    ${pts.length>1?`<polyline class="chart-line" points="${pts.map(p=>p.join(',')).join(' ')}"/>`:''}
    ${pts.map(p=>`<circle class="chart-dot" cx="${p[0]}" cy="${p[1]}" r="3"/>`).join('')}
  </svg>`;
}

function renderHome(){
  document.body.classList.remove('quiz');
  renderHeader();
  const U=units(); if(!sel) sel=new Set(U);
  const qs=subj.qs, pr=projection(store,qs), prior=firstTryRate(store);
  const seen=qs.filter(q=>store.att[q.id]&&store.att[q.id].length).length;
  const pool=pickPool();
  const weakN=qs.filter(q=>sel.has(q.u)&&pCorrect(store.att[q.id],prior)<0.8).length;
  const newN=qs.filter(q=>sel.has(q.u)&&!(store.att[q.id]&&store.att[q.id].length)).length;
  const hasData=store.sessions.length>0;
  const perU=U.map(u=>{const uq=qs.filter(q=>q.u===u);const n=10*(1-bankError(store,uq));
    return `<div><span>${esc(u)}</span><span class="mini"><i style="width:${n*10}%"></i></span><span style="text-align:right">${n.toFixed(1)}</span></div>`}).join('');
  app.innerHTML=`
  <div class="card">
    <h2>Tu proyección</h2>
    <div class="stats">
      <div class="stat"><small>Nota en el examen</small><strong>${hasData?pr.ex.mean.toFixed(1):'—'}</strong><em>${hasData?'entre '+pr.ex.lo.toFixed(1)+' y '+pr.ex.hi.toFixed(1):'haz un test para calcularla'}</em></div>
      <div class="stat"><small>Prob. de sacar 10</small><strong>${hasData?fmtPct(pr.ex.p10):'—'}</strong><em>${hasData?fmtPct(pr.ex.p95)+' de sacar ≥ 9,5':'30/30 en el examen'}</em></div>
      <div class="stat"><small>Para llegar al 10</small><strong>${hasData?fmtH(pr.hours):'—'}</strong><em>${hasData?(isFinite(pr.passes)?fmtH(pr.hours95)+' para el 9,5':'no mejoras al ritmo actual'):'de tests repetidos'}</em></div>
    </div>
    <p class="sub" style="margin-top:10px">Examen de ${EXAM_N} preguntas de los 3 temas mezclados · estudiado ${fmtH(pr.tCum/3600)} · ${seen}/${qs.length} preguntas vistas · ${pr.spq.toFixed(0)} s por pregunta</p>
    ${hasData&&pr.usingDefault?`<p class="sub" style="margin-top:10px">Con un solo test, las horas son una estimación inicial que supone que cada vuelta completa reduce a la mitad tus fallos. A partir del segundo test se calcula con tu ritmo real.</p>`:''}
    ${chart(store)}
    <div class="units">${perU}</div>
  </div>
  <div class="card">
    <h2>Nuevo test</h2>
    <div class="row">${U.map(u=>`<button class="chip ${sel.has(u)?'on':''}" data-u="${esc(u)}">${esc(u.split(' · ')[0])} · ${qs.filter(q=>q.u===u).length}</button>`).join('')}</div>
    <div style="margin:14px 0 4px" class="seg" id="modes">
      <button data-m="exam" class="${mode==='exam'?'on':''}">Examen</button>
      <button data-m="all" class="${mode==='all'?'on':''}">Todas</button>
      <button data-m="weak" class="${mode==='weak'?'on':''}">Flojas (${weakN})</button>
      <button data-m="new" class="${mode==='new'?'on':''}">Nuevas (${newN})</button>
    </div>
    <p class="sub">${mode==='exam'?EXAM_N+' preguntas al azar de los 3 temas, como en el examen':pool.length+' preguntas'} · orden y respuestas mezclados en cada repetición · ≈ ${fmtH(pool.length*pr.spq/3600)}</p>
    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" id="go" ${pool.length?'':'disabled'}>Empezar</button>
      ${hasData?'<button class="btn ghost small" id="reset">Borrar progreso</button>':''}
    </div>
  </div>
  <div class="card">
    <details>
      <summary>¿Cómo se calculan la nota y las horas?</summary>
      <p><b>Probabilidad de cada pregunta.</b> Se calcula con tus intentos en ella: el último pesa el doble que el anterior, y así sucesivamente. Las que aún no has visto cuentan con tu tasa de acierto a la primera.</p>
      <p><b>Nota en el examen.</b> Se simulan 4.000 exámenes de ${EXAM_N} preguntas sacadas al azar de las de los 3 temas mezclados, acertando cada una con su probabilidad. La nota es la media de esos exámenes; el rango es entre qué notas caen 8 de cada 10 simulaciones; la probabilidad de 10 es cuántas veces sale ${EXAM_N}/${EXAM_N}.</p>
      <p><b>Horas hasta el 10.</b> Al acabar cada test se guarda tu error y el tiempo acumulado, y se ajusta una curva de aprendizaje error = e₀·e<sup>−k·t</sup>. "Llegar al 10" es el punto en que sacar ${EXAM_N}/${EXAM_N} pasa a ser más probable que no (fallar menos del ~2,3 % de las preguntas). El tiempo es lo que tardas de verdad por pregunta (máx. ${MAX_SEC} s cada una).</p>
      <p><b>Ojo:</b> supone que el examen se parece a estos Kahoots y que mantienes el mismo ritmo. Repetir solo las flojas suele acercarte al 10 antes que dar vueltas completas.</p>
    </details>
  </div>`;
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const u=b.dataset.u;sel.has(u)?sel.delete(u):sel.add(u);renderHome()});
  app.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;renderHome()});
  app.querySelector('#go').onclick=()=>start(pickPool());
  const r=app.querySelector('#reset');
  if(r) r.onclick=()=>{ if(r.dataset.c){store={att:{},sessions:[]};saveStore(subj.id,store);renderHome()} else {r.dataset.c=1;r.textContent='Pulsa otra vez para confirmar'} };
}
function pickPool(){
  const prior=firstTryRate(store);
  let qs=subj.qs.filter(q=>sel&&sel.has(q.u));
  if(mode==='weak') qs=qs.filter(q=>pCorrect(store.att[q.id],prior)<0.8);
  if(mode==='new') qs=qs.filter(q=>!(store.att[q.id]&&store.att[q.id].length));
  if(mode==='exam') qs=shuffle(subj.qs).slice(0,EXAM_N);
  return qs;
}

function start(list){
  const before=store.sessions.length?projection(store,subj.qs).nota:null;
  const qs=shuffle(list).map(q=>{const opts=shuffle([q.ok,...q.no]);return {...q,opts,c:opts.indexOf(q.ok)}});
  run={qs,i:0,ans:Array(qs.length).fill(null),t0:performance.now(),secs:0,before,saved:false};
  window.scrollTo(0,0);renderQ();
}
function renderQ(){
  document.body.classList.add('quiz');
  const {qs,i,ans}=run,q=qs[i],a=ans[i];
  const done=ans.filter(x=>x!==null).length,ok=ans.filter((x,k)=>x===qs[k].c).length;
  app.innerHTML=`<div class="card">
    <div class="meta"><span>${i+1} / ${qs.length} · ${esc(q.u.split(' · ')[0])}</span><span>${ok} de ${done} bien</span></div>
    <div class="bar"><i style="width:${done/qs.length*100}%"></i></div>
    <p class="q">${esc(q.q)}</p>
    ${q.opts.map((o,k)=>{let c='';if(a!==null){if(k===q.c)c='ok';else if(k===a)c='bad'}
      return `<button class="opt ${c}" data-k="${k}" ${a!==null?'disabled':''}><b>${L[k]}</b><span>${esc(o)}</span></button>`}).join('')}
    <div class="fb ${a===null?'':(a===q.c?'ok':'bad')}">${a===null?'':(a===q.c?'¡Correcta!':'Fallo. La buena era la '+L[q.c]+'.')}</div>
    <div class="nav">
      <button class="btn ghost" id="prev" ${i===0?'disabled':''}>Anterior</button>
      <button class="btn ghost" id="end">Salir</button>
      <button class="btn" id="next" ${a===null?'disabled':''}>${i===qs.length-1?'Ver resultado':'Siguiente'}</button>
    </div>
    <div class="hint">A–D o 1–4 para responder · Enter o → para seguir</div>
  </div>`;
  if(a===null){run.t0=performance.now();window.scrollTo(0,0)}
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  app.querySelector('#prev').onclick=()=>{run.i--;renderQ()};
  app.querySelector('#next').onclick=next;
  app.querySelector('#end').onclick=finish;
}
function answer(k){
  const q=run.qs[run.i];
  if(run.ans[run.i]!==null||k>=q.opts.length) return;
  const s=Math.min((performance.now()-run.t0)/1000,MAX_SEC);
  run.ans[run.i]=k; run.secs+=s;
  (store.att[q.id]=store.att[q.id]||[]).push({ok:k===q.c,s:Math.round(s*10)/10,d:Date.now()});
  saveStore(subj.id,store);
  renderQ();
}
function next(){if(run.ans[run.i]===null)return;if(run.i<run.qs.length-1){run.i++;renderQ()}else finish()}

function finish(){
  document.body.classList.remove('quiz');
  const {qs,ans}=run;
  const answered=ans.filter(x=>x!==null).length;
  if(answered&&!run.saved){
    const prev=store.sessions.length?store.sessions[store.sessions.length-1].tCum:0;
    store.sessions.push({d:Date.now(),n:answered,ok:ans.filter((x,k)=>x===qs[k].c).length,secs:Math.round(run.secs),tCum:prev+run.secs,err:bankError(store,subj.qs)});
    saveStore(subj.id,store); run.saved=true;
  }
  const ok=ans.filter((x,k)=>x===qs[k].c).length;
  const wrong=qs.filter((q,k)=>ans[k]!==null&&ans[k]!==q.c);
  const pr=projection(store,subj.qs);
  const delta=run.before===null?0:pr.nota-run.before;
  app.innerHTML=`<div class="card">
    <div class="meta"><span>Resultado del test</span><span>${answered} de ${qs.length} respondidas · ${fmtH(run.secs/3600)}</span></div>
    <div class="stats">
      <div class="stat"><small>En este test</small><strong>${answered?(ok/answered*10).toFixed(1):'—'}</strong><em>${ok} / ${answered} aciertos</em></div>
      <div class="stat"><small>Nota en el examen</small><strong>${pr.ex.mean.toFixed(1)}</strong><em>${run.before===null?'primera estimación':(delta>=0?'+':'')+delta.toFixed(1)+' respecto a antes'} · prob. de 10: ${fmtPct(pr.ex.p10)}</em></div>
      <div class="stat"><small>Para llegar al 10</small><strong>${fmtH(pr.hours)}</strong><em>${isFinite(pr.passes)?fmtH(pr.hours95)+' para el 9,5':'no mejoras al ritmo actual'}</em></div>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
      ${wrong.length?`<button class="btn" id="rw">Repetir las ${wrong.length} falladas</button>`:''}
      <button class="btn ghost" id="home">Volver al inicio</button>
    </div>
  </div>
  ${wrong.length?`<div class="card rev"><h2>Repaso de fallos</h2>${wrong.map(q=>{const k=qs.indexOf(q);return `<div class="it"><p>${esc(q.q)}</p><div class="y">Tu respuesta: ${esc(q.opts[ans[k]])}</div><div class="c">Correcta: ${esc(q.opts[q.c])}</div></div>`}).join('')}</div>`:''}`;
  const rw=app.querySelector('#rw');
  if(rw) rw.onclick=()=>start(wrong.map(q=>subj.qs.find(x=>x.id===q.id)));
  app.querySelector('#home').onclick=()=>{run=null;renderHome()};
  window.scrollTo(0,0);
}

document.addEventListener('keydown',e=>{
  if(!run||!app.querySelector('.opt'))return;
  const up=e.key.toUpperCase();
  let k=L.indexOf(up);if(k<0)k="1234".indexOf(e.key);
  if(k>=0&&e.key.length===1)answer(k);
  else if(e.key==='Enter'||e.key==='ArrowRight')next();
  else if(e.key==='ArrowLeft'&&run.i>0){run.i--;renderQ()}
});
renderHome();
</script>
</body>
</html>
